name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} desktop app
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build desktop application
        run: pyinstaller --noconfirm --clean StudyPilotAir.spec
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPilotAir-${{ matrix.platform }}
          path: dist/StudyPilotAir*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish release downloads
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/StudyPilotAir*
